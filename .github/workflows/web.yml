# Publica la web (docs/) en Netlify cada vez que cambia en main.
# Netlify, y no GitHub Pages, porque los formularios usan Netlify Forms.
#
# Una sola vez, en GitHub → Settings → Secrets and variables → Actions:
#   NETLIFY_AUTH_TOKEN  token personal (Netlify → User settings → Applications → New access token)
#   NETLIFY_SITE_ID     Project ID del sitio (Netlify → Site configuration → General)
name: Publicar la web

on:
  push:
    branches: [main]
    paths: ['docs/**', 'netlify.toml', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Desplegar en Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::Faltan los secretos NETLIFY_AUTH_TOKEN y NETLIFY_SITE_ID (ver el comentario al inicio de este archivo)."
            exit 1
          fi
          npx --yes netlify-cli deploy --dir=docs --prod --message "${GITHUB_SHA::7} ${{ github.event.head_commit.message && 'push' || 'manual' }}"
