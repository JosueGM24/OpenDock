# Paquetes de Linux para cada versión: la extensión de GNOME Shell (.zip) y el OpenDock nativo
# como .deb (Debian 13 / Ubuntu 24.10+), .rpm (Fedora, openSUSE) y paquete de Arch.
# Con una etiqueta v* los sube a la misma versión de GitHub Releases que el .exe, con nombres
# fijos para que releases/latest/download/... (lo que usa install.sh) siempre funcione.
name: Versión para Linux

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta ya publicada a la que subir los paquetes (p. ej. v2.1.0)'
        required: false

permissions:
  contents: write

env:
  UUID: opendock@josuegm24.github.io
  # la versión: la etiqueta que se empuja, o la que se indica al lanzarlo a mano
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  extension:
    name: Extensión de GNOME (.zip)
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-bin zip
      - name: Empaquetar
        run: bash linux/gnome-extension/build.sh "$PWD/out"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-extension
          path: out/${{ env.UUID }}.shell-extension.zip

  deb:
    name: Paquete .deb
    timeout-minutes: 25
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Paquetes
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential meson ninja-build \
            pkg-config dpkg-dev libgtk-4-dev libglib2.0-dev libgtk4-layer-shell-dev libwayland-dev \
            libwayland-bin libx11-dev libxcomposite-dev libpulse-dev libcanberra-dev
      - uses: actions/checkout@v4
      - name: Versión
        run: |
          v=$(sed -n "s/^  version: '\(.*\)',$/\1/p" linux/opendock/meson.build)
          [ -n "$TAG" ] && v="${TAG#v}"
          echo "VER=$v" >> "$GITHUB_ENV"
          # la de la etiqueta también en el binario (opendock --version)
          sed -i "s/^  version: '.*',\$/  version: '$v',/" linux/opendock/meson.build
      - name: Compilar
        run: |
          meson setup build linux/opendock --prefix=/usr --buildtype=release -Dsysconfdir=/etc
          meson compile -C build
          ./build/opendock --version
          DESTDIR="$PWD/pkg" meson install -C build
          install -Dm644 LICENSE pkg/usr/share/doc/opendock/copyright
      - name: Construir el .deb
        run: |
          # dpkg-shlibdeps calcula las dependencias de las bibliotecas que de verdad enlaza
          mkdir -p debian && printf 'Source: opendock\n\nPackage: opendock\nArchitecture: any\n' > debian/control
          deps=$(dpkg-shlibdeps -O -e pkg/usr/bin/opendock | sed -n 's/^shlibs:Depends=//p')
          mkdir -p pkg/DEBIAN
          cat > pkg/DEBIAN/control <<EOF
          Package: opendock
          Version: ${VER}
          Architecture: amd64
          Maintainer: OpenDock <noreply@github.com>
          Depends: ${deps}
          Recommends: network-manager, upower, bluez
          Section: x11
          Priority: optional
          Homepage: https://open-dock.netlify.app/
          Description: Esquinas redondeadas, notch con notificaciones, barra superior y dock
           Para escritorios Wayland con layer-shell (KDE Plasma, Hyprland, Sway, labwc,
           COSMIC...) y X11 (XFCE, MATE, Cinnamon, i3...). En GNOME usa la extensión.
          EOF
          sed -i 's/^          //' pkg/DEBIAN/control
          echo /etc/xdg/autostart/opendock.desktop > pkg/DEBIAN/conffiles
          cat pkg/DEBIAN/control
          dpkg-deb --build --root-owner-group pkg opendock-linux-amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: opendock-linux-amd64.deb

  rpm:
    name: Paquete .rpm
    timeout-minutes: 25
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Paquetes
        run: |
          dnf install -y git gcc meson ninja-build pkgconf-pkg-config rpm-build gtk4-devel \
            gtk4-layer-shell-devel wayland-devel libX11-devel libXcomposite-devel pulseaudio-libs-devel libcanberra-devel
      - uses: actions/checkout@v4
      - name: Versión
        run: |
          v=$(sed -n "s/^  version: '\(.*\)',$/\1/p" linux/opendock/meson.build)
          [ -n "$TAG" ] && v="${TAG#v}"
          echo "VER=$v" >> "$GITHUB_ENV"
          # la de la etiqueta también en el binario (opendock --version)
          sed -i "s/^  version: '.*',\$/  version: '$v',/" linux/opendock/meson.build
      - name: Compilar
        run: |
          meson setup build linux/opendock --prefix=/usr --buildtype=release -Dsysconfdir=/etc
          meson compile -C build
          ./build/opendock --version
          DESTDIR="$PWD/stage" meson install -C build
      - name: Construir el .rpm
        run: |
          # rpmbuild saca los Requires de las bibliotecas del ejecutable (libgtk-4.so.1...),
          # así el mismo paquete vale para Fedora y openSUSE.
          cat > opendock.spec <<'EOF'
          %global debug_package %{nil}
          %global _build_id_links none
          Name:     opendock
          Version:  %{ver}
          Release:  1
          Summary:  Esquinas redondeadas, notch con notificaciones, barra superior y dock
          License:  MIT
          URL:      https://open-dock.netlify.app/
          Recommends: NetworkManager upower bluez
          %description
          Para escritorios Wayland con layer-shell (KDE Plasma, Hyprland, Sway, labwc,
          COSMIC...) y X11 (XFCE, MATE, Cinnamon, i3...). En GNOME usa la extensión.
          %install
          cp -a %{stage}/. %{buildroot}/
          install -Dm644 %{top}/LICENSE %{buildroot}%{_datadir}/licenses/opendock/LICENSE
          %files
          %{_bindir}/opendock
          %{_datadir}/opendock
          %{_datadir}/icons/hicolor/512x512/apps/opendock.png
          %{_datadir}/licenses/opendock
          %config(noreplace) %{_sysconfdir}/xdg/autostart/opendock.desktop
          EOF
          sed -i 's/^          //' opendock.spec
          rpmbuild -bb opendock.spec --define "ver ${VER//-/_}" --define "stage $PWD/stage" \
            --define "top $PWD" --define "_rpmdir $PWD/rpms"
          cp rpms/x86_64/opendock-*.rpm opendock-linux-x86_64.rpm
          rpm -qpR opendock-linux-x86_64.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: opendock-linux-x86_64.rpm

  arch:
    name: Paquete de Arch
    timeout-minutes: 25
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Paquetes
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git meson ninja \
            gtk4 gtk4-layer-shell glib2 libpulse libcanberra libx11 libxcomposite wayland hicolor-icon-theme
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: makepkg con el código de esta versión
        run: |
          useradd -m constructor
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          install -d -o constructor /tmp/pkg/src
          cp linux/opendock/PKGBUILD /tmp/pkg/
          git clone -q "$GITHUB_WORKSPACE" /tmp/pkg/src/OpenDock
          [ -z "$TAG" ] || sed -i "s/^  version: '.*',\$/  version: '${TAG#v}',/" /tmp/pkg/src/OpenDock/linux/opendock/meson.build
          chown -R constructor /tmp/pkg
          cd /tmp/pkg
          runuser -u constructor -- makepkg -e -f --noconfirm
          cp /tmp/pkg/opendock-git-[0-9]*.pkg.tar.zst "$GITHUB_WORKSPACE/opendock-linux-x86_64.pkg.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arch
          path: opendock-linux-x86_64.pkg.tar.zst

  gnome-deb:
    name: GNOME (.deb para Ubuntu y Debian)
    timeout-minutes: 25
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Paquetes
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git libglib2.0-bin dpkg-dev
      - uses: actions/checkout@v4
      - name: Versión
        run: |
          v=$(sed -n "s/^  version: '\(.*\)',$/\1/p" linux/opendock/meson.build)
          [ -n "$TAG" ] && v="${TAG#v}"
          echo "VER=$v" >> "$GITHUB_ENV"
      - name: Construir el .deb
        run: |
          sh linux/gnome-package/stage.sh pkg
          mkdir -p pkg/DEBIAN
          cat > pkg/DEBIAN/control <<EOF
          Package: opendock-gnome
          Version: ${VER}
          Architecture: all
          Maintainer: OpenDock <noreply@github.com>
          Depends: gnome-shell (>= 45)
          Section: gnome
          Priority: optional
          Homepage: https://open-dock.netlify.app/
          Description: OpenDock para GNOME: notch, dock y esquinas redondeadas
           La extensión de GNOME Shell de OpenDock, para todo el sistema. Se activa sola
           la próxima vez que entras en GNOME (cierra sesión y vuelve a entrar).
          EOF
          echo /etc/xdg/autostart/opendock-gnome-enable.desktop > pkg/DEBIAN/conffiles
          dpkg-deb --build --root-owner-group pkg opendock-gnome.deb
          dpkg-deb --info opendock-gnome.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-gnome-deb
          path: opendock-gnome.deb

  gnome-rpm:
    name: GNOME (.rpm para Fedora y openSUSE)
    timeout-minutes: 25
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Paquetes
        run: dnf install -y git glib2 rpm-build
      - uses: actions/checkout@v4
      - name: Versión
        run: |
          v=$(sed -n "s/^  version: '\(.*\)',$/\1/p" linux/opendock/meson.build)
          [ -n "$TAG" ] && v="${TAG#v}"
          echo "VER=$v" >> "$GITHUB_ENV"
      - name: Construir el .rpm
        run: |
          sh linux/gnome-package/stage.sh "$PWD/stage"
          cat > opendock-gnome.spec <<'EOF'
          Name:      opendock-gnome
          Version:   %{ver}
          Release:   1
          Summary:   OpenDock para GNOME: notch, dock y esquinas redondeadas
          License:   MIT
          URL:       https://open-dock.netlify.app/
          BuildArch: noarch
          Requires:  gnome-shell >= 45
          %description
          La extensión de GNOME Shell de OpenDock, para todo el sistema. Se activa sola
          la próxima vez que entras en GNOME (cierra sesión y vuelve a entrar).
          %install
          cp -a %{stage}/. %{buildroot}/
          %files
          /usr/share/gnome-shell/extensions/opendock@josuegm24.github.io
          /usr/libexec/opendock-gnome-enable
          %config(noreplace) /etc/xdg/autostart/opendock-gnome-enable.desktop
          /usr/share/doc/opendock-gnome
          EOF
          sed -i 's/^          //' opendock-gnome.spec
          rpmbuild -bb opendock-gnome.spec --define "ver ${VER//-/_}" --define "stage $PWD/stage" --define "_rpmdir $PWD/rpms"
          cp rpms/noarch/opendock-gnome-*.rpm opendock-gnome.rpm
          rpm -qpR opendock-gnome.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-gnome-rpm
          path: opendock-gnome.rpm

  gnome-arch:
    name: GNOME (paquete de Arch y Manjaro)
    timeout-minutes: 25
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Paquetes
        run: pacman -Syu --noconfirm --needed base-devel git glib2
      - uses: actions/checkout@v4
      - name: Versión
        run: |
          v=$(sed -n "s/^  version: '\(.*\)',$/\1/p" linux/opendock/meson.build)
          [ -n "$TAG" ] && v="${TAG#v}"
          echo "VER=$v" >> "$GITHUB_ENV"
      - name: Construir el paquete
        run: |
          sh linux/gnome-package/stage.sh /tmp/stage
          useradd -m constructor
          install -d -o constructor /tmp/pkg
          # Arch pone los ayudantes en /usr/lib, no en /usr/libexec
          mkdir -p /tmp/stage/usr/lib/opendock-gnome
          mv /tmp/stage/usr/libexec/opendock-gnome-enable /tmp/stage/usr/lib/opendock-gnome/
          rmdir /tmp/stage/usr/libexec
          sed -i 's|/usr/libexec/opendock-gnome-enable|/usr/lib/opendock-gnome/opendock-gnome-enable|' /tmp/stage/etc/xdg/autostart/opendock-gnome-enable.desktop
          cat > /tmp/pkg/PKGBUILD <<EOF
          pkgname=opendock-gnome
          pkgver=${VER//-/_}
          pkgrel=1
          pkgdesc="OpenDock para GNOME: notch, dock y esquinas redondeadas (se activa solo al entrar)"
          arch=('any')
          url="https://open-dock.netlify.app/"
          license=('MIT')
          depends=('gnome-shell')
          conflicts=('gnome-shell-extension-opendock')
          backup=('etc/xdg/autostart/opendock-gnome-enable.desktop')
          package() { cp -a /tmp/stage/. "\$pkgdir"/; }
          EOF
          sed -i 's/^          //' /tmp/pkg/PKGBUILD
          chown -R constructor /tmp/pkg /tmp/stage
          cd /tmp/pkg && runuser -u constructor -- makepkg -f -d --noconfirm   # -d: solo se empaqueta, no hace falta GNOME aquí
          cp /tmp/pkg/opendock-gnome-*-any.pkg.tar.zst "$GITHUB_WORKSPACE/opendock-gnome-any.pkg.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-gnome-arch
          path: opendock-gnome-any.pkg.tar.zst

  publicar:
    name: Subir a la versión
    timeout-minutes: 25
    needs: [extension, deb, rpm, arch, gnome-deb, gnome-rpm, gnome-arch]
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist
      - name: Subir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt >> "$GITHUB_STEP_SUMMARY"
          # la versión la crea el workflow de Windows; si tarda o falló, la creamos aquí
          for i in $(seq 1 40); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            [ "$i" = 40 ] && gh release create "$TAG" --title "OpenDock ${TAG#v}" --generate-notes
            sleep 30
          done
          gh release upload "$TAG" * --clobber
