# Compila OpenDock.exe con MSVC (Control Flow Guard, CET, CRT estática, DLL solo de System32)
# y comprueba sus protecciones. Con una etiqueta v* (git tag v2.0.0 && git push --tags) además
# publica la versión en GitHub Releases con el .exe y su SHA-256: es lo que descarga la web.
name: Versión para Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    env:
      SIGNED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}   # 'true' en cuanto exista el secreto
    steps:
      - uses: actions/checkout@v4

      - name: SQLite estática (vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sqlite3:x64-windows-static
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "SQLITE_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static" >> $env:GITHUB_ENV

      - name: Compilar con MSVC
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          call build.bat || exit /b 1

      - name: Comprobar protecciones
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/check_pe.py OpenDock.exe --strict

      # Sin firmar: es lo que se envía a SignPath (y lo que se publica si aún no hay firma).
      - uses: actions/upload-artifact@v4
        id: unsigned
        with:
          name: OpenDock-unsigned
          path: OpenDock.exe

      # Firma Authenticode gratuita de SignPath Foundation para proyectos de código abierto.
      # Se activa sola al crear el secreto SIGNPATH_API_TOKEN y la variable
      # SIGNPATH_ORGANIZATION_ID (Settings → Secrets and variables → Actions).
      # El .exe se compila aquí, en un runner de GitHub: SignPath solo firma lo que sale del CI.
      - name: Firmar con SignPath
        if: env.SIGNED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: OpenDock
          signing-policy-slug: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: initial
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Comprobar la firma
        if: env.SIGNED == 'true'
        shell: pwsh
        run: |
          Copy-Item signed/OpenDock.exe OpenDock.exe -Force
          $sig = Get-AuthenticodeSignature OpenDock.exe
          "Firma: $($sig.Status) · $($sig.SignerCertificate.Subject)" >> $env:GITHUB_STEP_SUMMARY
          if ($sig.Status -ne 'Valid') { throw "La firma no es válida: $($sig.StatusMessage)" }
          python tools/check_pe.py OpenDock.exe --strict

      # Una versión con etiqueta sin firmar se publica igual, pero queda avisado en el resumen.
      - name: Aviso si no está firmado
        if: env.SIGNED != 'true' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: '"::warning::OpenDock.exe se publica SIN FIRMAR: los antivirus y SmartScreen pueden marcarlo." | Write-Output'

      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash OpenDock.exe -Algorithm SHA256).Hash.ToLower()
          "$h  OpenDock.exe" | Out-File OpenDock.exe.sha256 -Encoding ascii -NoNewline
          "SHA-256: $h" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: OpenDock
          path: |
            OpenDock.exe
            OpenDock.exe.sha256

      - name: Publicar la versión
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME OpenDock.exe OpenDock.exe.sha256 `
            --title "OpenDock $($env:GITHUB_REF_NAME.TrimStart('v'))" --generate-notes
