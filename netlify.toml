# La web de OpenDock: archivos estáticos en docs/ (generados con site/build_site.py).
# Netlify la publica al conectar este repo (Git): cada push a main despliega docs/.
[build]
  publish = "docs"
  command = "echo 'sin compilación: docs/ ya está generado'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Sin caché larga: Netlify revalida con ETag, y el CSS y el JS llevan ?v=<huella> en su URL,
# así que una página nueva nunca se mezcla con un archivo viejo.
